<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Ekdanai Kummee, Application Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef3fa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="1" stop-color="#1a9e74"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#1a9e74" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#1a9e74" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1f2328" fill-opacity="0.08"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <path id="e1" d="M800,150 L905,88"/>
    <path id="e2" d="M800,150 L905,212"/>
    <path id="e3" d="M935,88 L1040,150"/>
    <path id="e4" d="M935,212 L1040,150"/>
    <path id="e5" d="M1056,150 L1135,150"/>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#d0d7de"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="118" font-size="52" font-weight="700" fill="#1f2328" letter-spacing="-1">Ekdanai Kummee</text>
    <text x="72" y="160" font-size="21" font-weight="600" fill="url(#accent)">Application Engineer</text>
    <text x="72" y="196" font-size="16" fill="#57606a">DevOps · Data platforms · Full-stack web</text>
    <text x="72" y="236" font-size="14" fill="#6e7781">Delta Electronics Thailand · Open source tooling for Kafka and Go</text>
  </g>

  <g stroke="#c5ced9" stroke-width="2" fill="none">
    <use href="#e1"/><use href="#e2"/><use href="#e3"/><use href="#e4"/><use href="#e5"/>
  </g>

  <g fill="#ffffff" stroke="url(#accent)" stroke-width="2">
    <circle cx="800" cy="150" r="14"/>
    <circle cx="920" cy="88" r="14"/>
    <circle cx="920" cy="212" r="14"/>
    <circle cx="1040" cy="150" r="14"/>
    <rect x="1135" y="134" width="32" height="32" rx="8"/>
  </g>
  <g fill="#1a9e74">
    <circle cx="800" cy="150" r="4"/>
    <circle cx="920" cy="88" r="4"/>
    <circle cx="920" cy="212" r="4"/>
    <circle cx="1040" cy="150" r="4"/>
  </g>
  <rect x="1145" y="144" width="12" height="12" rx="2" fill="#0969da"/>

  <g fill="#1a9e74">
    <circle r="3.5" filter="url(#soft)" opacity="0.8"><animateMotion dur="2.2s" repeatCount="indefinite" begin="0s"><mpath href="#e1"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="2.2s" repeatCount="indefinite" begin="0s"><mpath href="#e1"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="2.2s" repeatCount="indefinite" begin="0.7s"><mpath href="#e2"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="2.2s" repeatCount="indefinite" begin="1.1s"><mpath href="#e3"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="2.2s" repeatCount="indefinite" begin="1.8s"><mpath href="#e4"/></animateMotion></circle>
    <circle r="3.5" fill="#0969da"><animateMotion dur="1.6s" repeatCount="indefinite" begin="0.4s"><mpath href="#e5"/></animateMotion></circle>
  </g>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#6e7781" text-anchor="middle">
    <text x="800" y="186">topic</text>
    <text x="920" y="66">validate</text>
    <text x="920" y="248">route</text>
    <text x="1040" y="186">deliver</text>
    <text x="1151" y="186">app</text>
  </g>
</svg>
